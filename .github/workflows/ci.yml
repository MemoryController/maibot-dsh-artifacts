name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check .

  dsh-protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dsh-commit:
          - 0958d8ac788ebbea5f2c507f3b024de3dd06cb24 # historical bundle 0.2.0
          - f008cdc039122d360dee67b86e1e2004083ba019 # main bundle 0.2.1 at review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch exact DSH producer sources
        env:
          DSH_ARTIFACTS_COMMIT: ${{ matrix.dsh-commit }}
        run: |
          git clone --no-checkout https://github.com/MemoryController/dsh-maibot-artifacts.git "$RUNNER_TEMP/dsh-producer"
          git -C "$RUNNER_TEMP/dsh-producer" checkout --detach "$DSH_ARTIFACTS_COMMIT"
      - name: Real DSH dist producer with scoped Files API double
        env:
          DSH_ARTIFACTS_SOURCE: ${{ runner.temp }}/dsh-producer
          DSH_ARTIFACTS_COMMIT: ${{ matrix.dsh-commit }}
        run: python -m pytest -q protocol_checks/dsh_protocol.py
