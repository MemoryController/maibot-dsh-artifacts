name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --ignore=tests/host_integration --ignore=tests/test_host_patch.py
      - run: ruff check .

  host-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-host-test.txt
      - name: Fetch exact upstream Host sources
        run: |
          git clone --depth 1 --branch v1.3.18 https://github.com/Mai-with-u/MaiBot.git /tmp/maibot-v1.3.18
          test "$(git -C /tmp/maibot-v1.3.18 rev-parse HEAD)" = "2a9af62cec37035d29237acbe2cf3adceb700b27"
      - name: Patch and real FileService component tests
        env:
          MAIBOT_SOURCE_PATH: /tmp/maibot-v1.3.18
        run: python -m pytest -q tests/test_host_patch.py tests/host_integration
