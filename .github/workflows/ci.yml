name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: ruff check .

  dsh-protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dsh-commit:
          - 0958d8ac788ebbea5f2c507f3b024de3dd06cb24 # historical bundle 0.2.0
          - f008cdc039122d360dee67b86e1e2004083ba019 # main bundle 0.2.1 at review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch exact DSH producer sources
        env:
          DSH_ARTIFACTS_COMMIT: ${{ matrix.dsh-commit }}
        run: |
          git clone --no-checkout https://github.com/MemoryController/dsh-maibot-artifacts.git "$RUNNER_TEMP/dsh-producer"
          git -C "$RUNNER_TEMP/dsh-producer" checkout --detach "$DSH_ARTIFACTS_COMMIT"
      - name: Real DSH dist producer with scoped Files API double
        env:
          DSH_ARTIFACTS_SOURCE: ${{ runner.temp }}/dsh-producer
          DSH_ARTIFACTS_COMMIT: ${{ matrix.dsh-commit }}
        run: python -m pytest -q protocol_checks/dsh_protocol.py

  stock-host-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt -r host_checks/requirements.txt
      - name: Fetch unmodified pinned component sources
        run: |
          git clone --no-checkout https://github.com/Mai-with-u/MaiBot.git "$RUNNER_TEMP/stock-maibot"
          git -C "$RUNNER_TEMP/stock-maibot" checkout --detach 2a9af62cec37035d29237acbe2cf3adceb700b27
          git clone --no-checkout https://github.com/MemoryController/dsh-maibot-artifacts.git "$RUNNER_TEMP/stock-dsh"
          git -C "$RUNNER_TEMP/stock-dsh" checkout --detach f008cdc039122d360dee67b86e1e2004083ba019
      - name: Isolated Host components, test-issued scopes, no ACP or QQ
        env:
          MAIBOT_SOURCE_PATH: ${{ runner.temp }}/stock-maibot
          DSH_ARTIFACTS_SOURCE: ${{ runner.temp }}/stock-dsh
        run: python -m pytest -q host_checks/stock_files.py
      - name: Official checkouts stay unchanged
        run: |
          test -z "$(git -C "$RUNNER_TEMP/stock-maibot" status --porcelain)"
          test -z "$(git -C "$RUNNER_TEMP/stock-dsh" status --porcelain)"

  drawpic-2-1-3-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Fetch read-only reference plugin v2.1.3
        run: |
          git clone --no-checkout https://github.com/WhiteCloudOL/maimai-drawpic-plugin.git "$RUNNER_TEMP/drawpic-reference"
          git -C "$RUNNER_TEMP/drawpic-reference" checkout --detach 56284ac69bed57829ea67ab68ce31309d10b9551
      - name: Verify unsupported media-index contract, no provider calls
        env:
          DRAW_PIC_SOURCE: ${{ runner.temp }}/drawpic-reference
        run: python -m pytest -q protocol_checks/drawpic_2_1_3.py
      - name: Reference checkout stays unchanged
        run: test -z "$(git -C "$RUNNER_TEMP/drawpic-reference" status --porcelain)"
